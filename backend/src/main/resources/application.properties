spring.application.name=loanguard-backend

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/loanguard
spring.datasource.username=loanguard
spring.datasource.password=loanguard
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =========================================================
# SERVER
# =========================================================

server.port=8082

# =========================================================
# JWT SECURITY
# =========================================================

security.jwt.secret=LoanGuardAI-SuperSecretKey-2026-SecurityToken-ChangeThisInProduction
security.jwt.expiration=86400000